```html
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Tecnologi</title>

  <!-- Tu archivo CSS actual -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<section class="register">

  <div class="register-container">

    <div class="register-box">

      <!-- HEADER -->
      <div class="register-header">

        <div class="logo">
          Tecnologi
        </div>

        <h2>Crear Cuenta</h2>

        <p>
          Únete a nuestra comunidad tecnológica
        </p>

      </div>


      <!-- FORMULARIO -->
      <form class="register-form" id="registerForm">

        <!-- NOMBRE -->
        <label for="nombre">
          Nombre
        </label>

        <div class="input-group">

          <span>👤</span>

          <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Ingresa tu nombre"
            required
          >

        </div>


        <!-- APELLIDO -->
        <label for="apellido">
          Apellido
        </label>

        <div class="input-group">

          <span>👤</span>

          <input
            type="text"
            id="apellido"
            name="apellido"
            placeholder="Ingresa tu apellido"
            required
          >

        </div>


        <!-- CORREO -->
        <label for="correo">
          Correo Electrónico
        </label>

        <div class="input-group">

          <span>📧</span>

          <input
            type="email"
            id="correo"
            name="correo"
            placeholder="tu@email.com"
            required
          >

        </div>


        <!-- CONTRASEÑA -->
        <label for="contrasena">
          Contraseña
        </label>

        <div class="input-group">

          <span>🔒</span>

          <input
            type="password"
            id="contrasena"
            name="contrasena"
            placeholder="Ingresa tu contraseña"
            required
          >

        </div>


        <!-- CONFIRMAR CONTRASEÑA -->
        <label for="confirmarContrasena">
          Confirmar Contraseña
        </label>

        <div class="input-group">

          <span>🔒</span>

          <input
            type="password"
            id="confirmarContrasena"
            name="confirmarContrasena"
            placeholder="Confirma tu contraseña"
            required
          >

        </div>


        <!-- TERMINOS -->
        <div class="terms">

          <input
            type="checkbox"
            id="terminos"
            required
          >

          <span>

            Acepto los
            <a href="#">
              términos y condiciones
            </a>

            y la

            <a href="privacy.html">
              política de privacidad
            </a>

          </span>

        </div>


        <!-- MENSAJE -->
        <div
          id="mensaje"
          style="
            display: none;
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
          "
        >
        </div>


        <!-- BOTON -->
        <button
          type="submit"
          class="btn-register"
          id="btnRegistro"
        >
          Crear Cuenta
        </button>

      </form>


      <!-- LOGIN -->
      <div class="register-footer">

        <p>

          ¿Ya tienes cuenta?

          <a href="login.html">
            Inicia sesión
          </a>

        </p>

      </div>

    </div>

  </div>

</section>


<!-- JAVASCRIPT DEL REGISTRO -->
<script src="registro.js"></script>

</body>

</html>
```
